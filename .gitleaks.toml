# Gitleaks config for the PUBLIC soakal/Nexus repo.
#
# The allowlisted values below are DELIBERATELY public — see commit 33e5bdd
# ("Revert 'Scrub real Tailscale hostname and LAN IP from public repo'").
# Do not "fix" them by scrubbing; do not remove these entries.

[extend]
useDefault = true

[allowlist]
description = "Intentional public infra values + security-exercise fixtures"
paths = [
    '''CLAUDE-SECURITY-[^/]*/''',
]
regexes = [
    '''tailfa52c\.ts\.net''',
    '''\b192\.168\.1\.\d{1,3}\b''',
    '''\b100\.\d{1,3}\.\d{1,3}\.\d{1,3}\b''',
]
